name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [x64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Setup VSTest
        uses: darenm/Setup-VSTest@v1.3

      # Backstop under the .githooks pre-commit and commit-msg hooks: catches
      # anything committed with --no-verify, or from a clone that never ran
      # "git config core.hooksPath .githooks". The checker itself is skipped
      # because its word list is a list of the words it rejects.
      - name: Language check
        run: |
          $files = git ls-files '*.hlsl' '*.hlsli' '*.ps1' |
              Where-Object { $_ -ne 'scripts/Test-Language.ps1' -and
                             $_ -notlike '.specify/*' }
          if ($files) { ./scripts/Test-Language.ps1 -Path $files }
        shell: pwsh

      - name: Build
        run: msbuild MatrixRain.sln -p:Configuration=${{ matrix.configuration }} -p:Platform=${{ matrix.platform }}

      - name: Run Tests
        run: vstest.console.exe ${{ matrix.platform }}/${{ matrix.configuration }}/MatrixRainTests.dll

      - name: Upload x64 Release Binary
        uses: actions/upload-artifact@v4
        if: matrix.configuration == 'Release'
        with:
          name: matrixrain-x64-Release
          path: |
            x64/Release/MatrixRain.exe
            x64/Release/MatrixRain.scr
          retention-days: 30

  build-arm64:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        configuration: [Debug, Release]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build ARM64
        run: msbuild MatrixRain.sln -p:Configuration=${{ matrix.configuration }} -p:Platform=ARM64

      - name: Upload ARM64 Release Binaries
        uses: actions/upload-artifact@v4
        if: matrix.configuration == 'Release'
        with:
          name: matrixrain-arm64-Release
          path: |
            ARM64/Release/MatrixRain.exe
            ARM64/Release/MatrixRain.scr
          retention-days: 30
